[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "BLE"]
ignore = [
    "B008",  # Depends(...) in argument defaults is the standard FastAPI DI pattern.
]

[tool.ruff.lint.per-file-ignores]
"app/services/document_service.py" = ["BLE001"]  # intentional: cleanup must not mask the original error.
"tests/*" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
