apiVersion: v2
name: document-extraction
description: Extract user-defined fields from PDF documents with a configurable Vision Model
type: application
version: 0.1.1
appVersion: "1.0.0"
icon: "https://raw.githubusercontent.com/revanthky/document-extraction-app/main/charts/document-extraction/assets/icon.svg"

annotations:
  dkubex: |
    url: "/document-extraction"
    displayName: Document Extraction
    icon: "https://raw.githubusercontent.com/revanthky/document-extraction-app/main/charts/document-extraction/assets/icon.svg"
    docs: "https://github.com/revanthky/document-extraction-app#readme"
    images:
      - "https://raw.githubusercontent.com/revanthky/document-extraction-app/main/charts/document-extraction/assets/icon.svg"
    description: "Extract user-defined fields from PDF documents using a configurable Vision/Multimodal LLM, with PostgreSQL + MinIO persistence."
    categories:
      - "AI / ML"
      - "Developer Tools"
    roles:
      - "admin"
      - "user"
    resources:
      cpu:
        min: "250m"
        recommended: "500m"
      memory:
        min: "512Mi"
        recommended: "1Gi"
    dependencies:
      - postgres
      - minio
    routing:
      type: basepath
    timeout: "10m"
