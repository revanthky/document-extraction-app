apiVersion: v1
kind: Service
metadata:
  name: {{ include "document-extraction.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "document-extraction.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "document-extraction.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
